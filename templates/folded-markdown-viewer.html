<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #0f1115);
  --card: var(--tg-theme-section-bg-color, #171a21);
  --fg: var(--tg-theme-text-color, #eef2f7);
  --muted: var(--tg-theme-hint-color, #9aa4b2);
  --accent: var(--tg-theme-accent-text-color, #7dd3fc);
  --border: var(--tg-theme-section-separator-color, #2b3240);
  --code-bg: color-mix(in srgb, var(--fg) 7%, transparent);
}
* { box-sizing: border-box; margin: 0; padding: 0 }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); padding: 14px; font-size: 14px; line-height: 1.55 }
.header { position: sticky; top: 0; z-index: 2; background: linear-gradient(var(--bg) 75%, color-mix(in srgb, var(--bg) 0%, transparent)); padding-bottom: 10px; margin-bottom: 8px }
h1.title { font-size: 21px; font-weight: 750; letter-spacing: -0.3px; margin-bottom: 4px }
.meta { font-size: 12px; color: var(--muted) }
.controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap }
button { border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 999px; padding: 7px 10px; font-size: 12px }
.section { background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; margin: 10px 0; overflow: hidden }
.section-head { display: flex; gap: 8px; align-items: baseline; padding: 12px 14px; cursor: pointer; user-select: none }
.arrow { color: var(--muted); transition: transform .15s; font-size: 12px }
.section.open .arrow { transform: rotate(90deg) }
.section-title { font-weight: 650; flex: 1 }
.section-level { color: var(--muted); font-size: 11px }
.section-body { display: none; border-top: 0.5px solid var(--border); padding: 12px 14px }
.section.open .section-body { display: block }
.doc { background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; padding: 16px }
h1, h2, h3, h4, h5, h6 { margin: 16px 0 8px; line-height: 1.25 }
h1 { font-size: 20px } h2 { font-size: 17px } h3 { font-size: 15px }
p { margin-bottom: 10px }
ul, ol { margin: 8px 0; padding-left: 24px } li { margin-bottom: 4px }
code { font-family: 'SF Mono', Consolas, monospace; font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px }
pre { background: var(--code-bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto; -webkit-overflow-scrolling: touch }
pre code { background: none; padding: 0; line-height: 1.5 }
blockquote { border-left: 3px solid var(--accent); padding: 4px 12px; margin: 10px 0; color: var(--muted); background: color-mix(in srgb, var(--accent) 5%, transparent); border-radius: 0 8px 8px 0 }
hr { border: none; border-top: 0.5px solid var(--border); margin: 16px 0 }
a { color: var(--accent); text-decoration: none }
table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px } th, td { padding: 8px 10px; text-align: left; border: 0.5px solid var(--border) } th { background: var(--code-bg); font-weight: 600; font-size: 12px }
.empty { color: var(--muted); text-align: center; padding: 32px 0 }
</style>
</head>
<body>
<div class="header">
  <h1 class="title">{{TITLE}}</h1>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <button id="expand">Expand all</button>
    <button id="collapse">Collapse all</button>
  </div>
</div>
<div id="content"></div>
<script>
const RAW = `{{MARKDOWN_DATA}}`;
const FOLD_LEVEL = {{FOLD_LEVEL}};

function escapeHtml(text) { return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}
function md(text) {
  const lines = text.split('\n');
  let html = '', inCode = false, inList = false, listType = '';
  function closeList() { if (inList) { html += '</' + listType + '>'; inList = false; } }
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim().startsWith('```')) { if (inCode) { html += '</code></pre>'; inCode = false; } else { closeList(); html += '<pre><code>'; inCode = true; } continue; }
    if (inCode) { html += escapeHtml(line) + '\n'; continue; }
    if (!line.trim()) { closeList(); continue; }
    const hMatch = line.match(/^(#{1,6})\s+(.*)/);
    if (hMatch) { closeList(); const level = hMatch[1].length; html += '<h' + level + '>' + inline(hMatch[2]) + '</h' + level + '>'; continue; }
    if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(line.trim())) { closeList(); html += '<hr>'; continue; }
    if (line.startsWith('> ')) { closeList(); html += '<blockquote>' + inline(line.slice(2)) + '</blockquote>'; continue; }
    const ulMatch = line.match(/^(\s*)[*\-+]\s+(.*)/);
    if (ulMatch) { if (!inList || listType !== 'ul') { closeList(); html += '<ul>'; inList = true; listType = 'ul'; } html += '<li>' + inline(ulMatch[2]) + '</li>'; continue; }
    const olMatch = line.match(/^(\s*)\d+\.\s+(.*)/);
    if (olMatch) { if (!inList || listType !== 'ol') { closeList(); html += '<ol>'; inList = true; listType = 'ol'; } html += '<li>' + inline(olMatch[2]) + '</li>'; continue; }
    if (line.includes('|') && i + 1 < lines.length && /\|[\s-:]+\|/.test(lines[i + 1])) {
      closeList(); const parseRow = r => r.split('|').map(c => c.trim()).filter(c => c);
      const headers = parseRow(line); html += '<table><thead><tr>' + headers.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>'; i += 2;
      while (i < lines.length && lines[i].includes('|')) { const cells = parseRow(lines[i]); html += '<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>'; i++; }
      html += '</tbody></table>'; i--; continue;
    }
    closeList(); html += '<p>' + inline(line) + '</p>';
  }
  closeList(); if (inCode) html += '</code></pre>'; return html;
}
function sections(markdown) {
  const lines = markdown.split('\n');
  const out = [];
  let preamble = [];
  let cur = null;
  for (const line of lines) {
    const m = line.match(/^(#{1,6})\s+(.*)/);
    if (m && m[1].length <= FOLD_LEVEL) {
      if (cur) out.push(cur);
      else if (preamble.join('\n').trim()) out.push({title: 'Overview', level: 0, body: preamble.join('\n')});
      cur = {title: m[2], level: m[1].length, body: ''};
    } else if (cur) cur.body += line + '\n';
    else preamble.push(line);
  }
  if (cur) out.push(cur);
  else if (preamble.join('\n').trim()) out.push({title: 'Document', level: 0, body: preamble.join('\n')});
  return out;
}
function render() {
  const root = document.getElementById('content');
  const secs = sections(RAW);
  document.getElementById('meta').textContent = RAW.split(/\s+/).filter(Boolean).length + ' words · ' + RAW.split('\n').length + ' lines · ' + secs.length + ' sections';
  if (!secs.length) { root.innerHTML = '<div class="empty">Empty document</div>'; return; }
  root.innerHTML = secs.map((s, i) => `<section class="section ${i === 0 ? 'open' : ''}"><div class="section-head"><span class="arrow">▶</span><span class="section-title">${inline(s.title)}</span><span class="section-level">h${s.level || 0}</span></div><div class="section-body">${md(s.body)}</div></section>`).join('');
}
document.addEventListener('click', e => { const head = e.target.closest('.section-head'); if (head) head.parentElement.classList.toggle('open'); });
document.getElementById('expand').onclick = () => document.querySelectorAll('.section').forEach(s => s.classList.add('open'));
document.getElementById('collapse').onclick = () => document.querySelectorAll('.section').forEach(s => s.classList.remove('open'));
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.setHeaderColor(tg.themeParams?.bg_color || '#0f1115'); tg.setBackgroundColor(tg.themeParams?.bg_color || '#0f1115'); } catch(e) {} }
render();
</script>
</body>
</html>
